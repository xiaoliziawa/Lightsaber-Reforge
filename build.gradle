plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run')
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            gameDirectory = project.file('run-data')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    modelTools {
        java.srcDir 'tools/model_exporter/src/main/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'JaredsMaven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'SighsMaven'
        url = 'https://maven.sighs.cc/repository/maven-public/'
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    implementation "curse.maven:dynamic-lights-227874:${dynamic_lights_file_id}"

    implementation "curse.maven:kubejs-238086:${kubejs_file_id}"
    implementation "curse.maven:rhino-416294:${rhino_file_id}"

    implementation "curse.maven:epic-fight-mod-405076:${epic_fight_file_id}"

    runtimeOnly "curse.maven:neat-238372:7774002"

    runtimeOnly "curse.maven:torohealth-continued-1412542:7488493"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '20000'])
}

tasks.register('exportBlockbenchModels', JavaExec) {
    group = 'model tools'
    description = 'Exports hard-coded LegacyModelRenderer models to Blockbench .bbmodel files.'
    dependsOn tasks.named('classes'), tasks.named('modelToolsClasses')
    classpath = sourceSets.modelTools.runtimeClasspath
    mainClass = 'com.fiskmods.lightsabers.tools.model.LegacyModelBlockbenchExporter'
    systemProperty 'lightsabers.recordModelExportData', 'true'

    args '--source', file('src/main/java/com/fiskmods/lightsabers/client/model').absolutePath,
            '--textures', file('src/main/resources/assets/lightsabers/textures/models').absolutePath,
            '--block-models', file('src/main/resources/assets/lightsabers/models/block').absolutePath,
            '--block-textures', file('src/main/resources/assets/lightsabers/textures/block').absolutePath,
            '--output', file(project.findProperty('modelOutput') ?: 'model_exports/blockbench').absolutePath

    var modelFilter = providers.gradleProperty('model')
    if (modelFilter.isPresent()) {
        args '--model', modelFilter.get()
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
